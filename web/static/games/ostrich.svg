<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- ミニゲーム「韋駝天」のアイコン: 夕焼けの空、鳥居のすき間に勾玉、跳ぶダチョウ -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7c6"/>
      <stop offset="1" stop-color="#f0b877"/>
    </linearGradient>
    <clipPath id="r"><rect width="128" height="128" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <circle cx="100" cy="30" r="12" fill="#ffab5c"/>
    <path d="M0 104 L28 78 L50 94 L78 66 L104 90 L128 76 V128 H0 Z" fill="#d9a877"/>
    <rect y="104" width="128" height="24" fill="#8b6a48"/>
    <rect y="104" width="128" height="3" fill="#5a3f28"/>
    <!-- 鳥居の柱(上と真ん中) -->
    <rect x="92" y="0" width="16" height="30" fill="#b8412c"/>
    <rect x="84" y="28" width="32" height="6" fill="#2a211c"/>
    <rect x="92" y="66" width="16" height="22" fill="#b8412c"/>
    <rect x="86" y="64" width="28" height="5" fill="#2a211c"/>
    <rect x="87" y="86" width="26" height="4" fill="#2a211c"/>
    <!-- 大きな勾玉(赤) -->
    <circle cx="100" cy="49" r="14" fill="#ef6a5a" opacity="0.3"/>
    <g transform="translate(100 49) rotate(-23)">
      <path d="M -5.5 -2.2 A 5.6 5.6 0 1 1 5.6 -1.4 Q 5 8 -3.2 9.5 Q -0.5 5 -5.5 -2.2 Z" fill="#ef6a5a" stroke="#a2291c" stroke-width="1.3"/>
      <circle cx="0.5" cy="-2.7" r="1.6" fill="#a2291c"/>
    </g>
    <!-- 小さな勾玉(黄) -->
    <g transform="translate(22 30) rotate(-23)">
      <path d="M -3.7 -1.5 A 3.8 3.8 0 1 1 3.8 -1 Q 3.4 5.4 -2.2 6.4 Q -0.3 3.4 -3.7 -1.5 Z" fill="#ffd84a" stroke="#c98f00" stroke-width="1"/>
    </g>
    <!-- ダチョウ(羽ばたき中) -->
    <g transform="translate(52 80)">
      <path d="M -2 0 L -8 14 L -4 22" stroke="#c98b5a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M 4 0 L 10 12 L 16 16" stroke="#c98b5a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-8" rx="19" ry="12" fill="#2b2230" transform="rotate(-10)"/>
      <ellipse cx="-19" cy="-14" rx="7" ry="5" fill="#f3ead8" transform="rotate(-35 -19 -14)"/>
      <path d="M -8 -14 L -22 -40 L 6 -16 Z" fill="#4a3d52"/>
      <path d="M 13 -14 Q 16 -28 13 -36" stroke="#e8c9a8" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="15" cy="-39" r="5.5" fill="#e8c9a8"/>
      <path d="M 19 -41 L 29 -38 L 19 -36 Z" fill="#e0a53a"/>
      <circle cx="16.5" cy="-40.5" r="1.4" fill="#111"/>
    </g>
    <!-- 速さの線 -->
    <g stroke="#fff8e1" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="6" y1="62" x2="20" y2="62"/>
      <line x1="10" y1="72" x2="26" y2="72"/>
      <line x1="4" y1="82" x2="16" y2="82"/>
    </g>
  </g>
</svg>
