<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- ミニゲーム(誤字祓い)のアイコン: 夜空に落ちてくる誤字の札と、祓う光の一閃 -->
  <defs>
    <linearGradient id="tgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1430"/>
      <stop offset="1" stop-color="#0d0b1c"/>
    </linearGradient>
    <linearGradient id="tgSlash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tgClip"><rect width="128" height="128" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#tgClip)">
    <rect width="128" height="128" fill="url(#tgBg)"/>
    <circle cx="98" cy="26" r="11" fill="#fff0d7" opacity="0.85"/>
    <!-- 上の札(直った言葉) -->
    <rect x="14" y="20" width="62" height="22" rx="5" fill="#3c280a" stroke="#ffd84a" stroke-width="1.5"/>
    <text x="45" y="36" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="14" fill="#fff4c4" text-anchor="middle">return</text>
    <!-- 下の札(誤字) -->
    <rect x="16" y="62" width="96" height="30" rx="6" fill="#0a0814" stroke="#ffd84a" stroke-opacity="0.6" stroke-width="2"/>
    <text x="64" y="84" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="20" text-anchor="middle" fill="#f4f1ea">ret<tspan fill="#ff6b5a">ru</tspan>n</text>
    <!-- 一閃 -->
    <path d="M10 118 L118 50" stroke="url(#tgSlash)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="80" r="14" fill="none" stroke="#ffd84a" stroke-width="2" opacity="0.8"/>
    <!-- 紙垂 -->
    <path d="M100 96 h8 v8 h4 v8 h-7 v8 h-7 v-8 h5 v-8 h-3 z" fill="#f7f3ea"/>
  </g>
</svg>
