on:
  push:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  GCP_KEY_PATH: "/tmp/key.json"

jobs:
  actions-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        shell: bash
        run: |
          set -ex
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      # Dockerfile は mise を使わないので、Node の版が mise.toml とそろっているかを確かめる
      - name: tool versions match mise.toml
        shell: bash
        run: |
          set -eu
          node=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)
          test -n "$node"
          for f in docker/*/Dockerfile; do
            if ! grep -q "^FROM node:${node}-" "$f"; then
              echo "$f の Node の版が mise.toml ($node) と違う" >&2
              exit 1
            fi
          done

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Node・Go の版は mise.toml にだけ書く(ここでは読むだけ)
      - name: setup tools (mise.toml)
        uses: jdx/mise-action@v5

      - name: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: nuxt setup
        run: echo "${{ secrets.DEV_ENV }}" > .env
        working-directory: ./web

      - name: nuxt generate
        run: |
          set -ex
          yarn
          yarn generate
        working-directory: ./web

      - name: copy files
        run: |
          set -ex
          rm -rf app/dist
          cp -r web/dist app
        working-directory: ./

      - name: firebase setup
        run: |
          set -ex
          npm install -g firebase-tools
          npm install
        working-directory: ./app/functions

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Node・Go の版は mise.toml にだけ書く(ここでは読むだけ)
      - name: setup tools (mise.toml)
        uses: jdx/mise-action@v5

      - name: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # テストは performance.js(moment のみ依存)を検証するため、
      # canvas 等のネイティブビルド(OGP生成専用)は不要。--ignore-scripts で高速・堅牢化する。
      - name: install functions deps
        run: npm install --ignore-scripts
        working-directory: ./app/functions

      - name: run functions tests
        run: npm test
        working-directory: ./app/functions
